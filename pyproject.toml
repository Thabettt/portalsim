[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portalsim"
version = "0.1.0"
description = "University Portal Simulator - mock portal backend for n8n/ERPNext integration demos"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Canonical test command:  python -m pytest
# Equivalent, zero-dependency: python -m unittest discover -s tests -t .
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
